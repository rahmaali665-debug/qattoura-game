<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج إجابة: قارن بين التبخر والتكثف</title>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: قطّورة and her speech bubble beside one comparison table; the cards to drag sit under the table.
   Single committed look (blue water), so every colour is set explicitly and there is no dark variant. */
:root {
  color-scheme: light;
  --deep: #0c4a94; --mid: #1f7fd0; --pale: #bfe6ff;
  --ink: #0b3d6b; --white: #ffffff;
  --card: #ffe9a6; --card-edge: #f2b92f;
  --same: #c9f1d6; --same-edge: #25a35a;
  --evap: #f58a1f; --cond: #2f74bd;
  --good: #1b8a4b; --bad: #d63b30;
  --font: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(var(--deep), var(--mid) 45%, #6fc1f2 80%, var(--pale)) fixed; background-color: var(--mid);
  color: var(--ink); font-family: var(--font); font-size: 19px; line-height: 1.4;
  padding-inline: 16px; padding-block: 14px 28px;
}
.page { max-width: 1180px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 18px; align-items: start; }
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.say { background: #fff7e3; border: 5px solid #ffb400; border-radius: 26px; padding: 8px 14px; text-align: center; font-weight: 800; font-size: 1.1rem; color: #5a3d00; position: relative; width: 100%; }
.say::after { content: ""; position: absolute; bottom: -22px; inset-inline-start: 50%; border: 11px solid transparent; border-top-color: #ffb400; }
.q { width: 100%; max-width: 190px; height: auto; }
.drops { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.drops i { width: 20px; height: 26px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: rgba(255, 255, 255, .35); border: 2px solid var(--white); }
.drops i.on { background: #ffd45c; }
.count { margin: 0; color: var(--white); font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }

.tag { align-self: center; background: #ffd45c; color: var(--ink); border: 3px solid var(--white); border-radius: 999px; padding: 0 20px; font-weight: 800; font-size: 1rem; }
h1 { margin: 0; background: var(--white); border-radius: 26px; padding: 8px 20px; text-align: center; font-weight: 800; font-size: clamp(1.15rem, 2.5vw, 1.7rem); line-height: 1.45; text-wrap: balance; box-shadow: 0 5px 0 rgba(4, 30, 75, .25); }
h1 b { color: var(--evap); } h1 em { color: var(--cond); font-style: normal; }

.table { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, 1.3fr); gap: 8px; background: rgba(255, 255, 255, .22); border: 3px solid var(--white); border-radius: 24px; padding: 10px; }
.th, .rl { border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; font-weight: 800; padding: 6px 8px; min-width: 0; }
.th { color: var(--white); font-size: clamp(1.05rem, 2.3vw, 1.5rem); min-height: 54px; }
.th.k { background: var(--ink); } .th.e { background: var(--evap); } .th.c { background: var(--cond); }
.rl { background: var(--white); font-size: clamp(.95rem, 1.9vw, 1.2rem); line-height: 1.3; }
.slot { min-height: 66px; border: 3px dashed var(--white); border-radius: 16px; background: rgba(255, 255, 255, .4); display: flex; flex-direction: column; align-items: stretch; justify-content: center; padding: 4px; cursor: pointer; min-width: 0; }
.slot.wide { grid-column: 2 / 4; background: rgba(201, 241, 214, .55); }
.slot.over, .slot.ready:hover { border-color: #ffe27a; box-shadow: 0 0 0 5px rgba(255, 226, 122, .6); }
.slot:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
.slot.full { border-style: solid; background: none; }
.slot.good { border-color: var(--good); } .slot.bad { border-color: var(--bad); border-style: dashed; }
.fix { margin: 4px 2px 0; font-size: .9rem; font-weight: 700; color: var(--white); background: var(--good); border-radius: 10px; padding: 1px 8px; text-align: center; }

.bank-title { margin: 4px 0 0; color: var(--white); font-weight: 800; text-align: center; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; background: rgba(255, 255, 255, .22); border: 3px dashed var(--white); border-radius: 22px; padding: 12px; min-height: 76px; cursor: pointer; }
.bank.over { border-color: #ffe27a; }

.chip { font: inherit; font-weight: 700; font-size: clamp(.95rem, 1.9vw, 1.2rem); color: var(--ink); background: linear-gradient(#fff6d6, var(--card)); border: 3px solid var(--white); border-bottom: 6px solid var(--card-edge); border-radius: 14px; padding: 8px 12px; min-height: 50px; text-align: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; position: relative; max-width: 100%; }
.chip.same { background: linear-gradient(#effbf2, var(--same)); border-bottom-color: var(--same-edge); }
.chip:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
.chip.selected { outline: 4px solid var(--white); box-shadow: 0 0 0 8px rgba(255, 255, 255, .45); }
.chip.lifting { opacity: .3; }
.chip.ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) rotate(-4deg); box-shadow: 0 14px 26px rgba(4, 30, 75, .45); }
.chip.no { border-color: var(--bad); }
.locked .chip { cursor: default; }
.slot.good .chip::before, .slot.bad .chip::before { position: absolute; top: -12px; inset-inline-start: -10px; width: 28px; height: 28px; border-radius: 50%; color: var(--white); border: 3px solid var(--white); font-size: .95rem; line-height: 22px; text-align: center; }
.slot.good .chip::before { content: "✓"; background: var(--good); }
.slot.bad .chip::before { content: "✗"; background: var(--bad); }

.done-btn { align-self: center; font: inherit; font-weight: 800; font-size: 1.5rem; color: var(--white); background: linear-gradient(#ffac33, #ff8a00); border: 4px solid var(--white); border-radius: 999px; padding: 4px 46px; cursor: pointer; box-shadow: 0 6px 0 #c96200; }
.done-btn:disabled { background: #9fb6cf; box-shadow: 0 6px 0 #6f8aa6; cursor: not-allowed; }
.done-btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.hint { margin: 0; text-align: center; color: var(--white); font-weight: 700; min-height: 1.4em; }

.result { background: var(--white); border-radius: 26px; padding: 12px 20px; text-align: center; box-shadow: 0 6px 0 rgba(4, 30, 75, .25); }
.result .big { margin: 0; font-weight: 800; font-size: 2rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
.result .stars { color: #f2b92f; letter-spacing: 4px; font-size: 2rem; line-height: 1.2; }
.result .stars s { color: #cfd9e4; text-decoration: none; }
.result p { margin: 2px 0; font-weight: 700; }

@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; }
  .side { position: static; flex-direction: row; flex-wrap: wrap; justify-content: center; order: -1; }
  .q { max-width: 84px; order: -1; }
  .say { flex: 1 1 200px; width: auto; }
  .say::after { display: none; }
  .table { grid-template-columns: minmax(0, .8fr) minmax(0, 1fr) minmax(0, 1fr); padding: 6px; gap: 6px; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip.no { animation: shake .45s; }
  .q.happy { animation: hop .6s 2; }
  @keyframes shake { 20%, 60% { translate: -8px 0; } 40%, 80% { translate: 8px 0; } }
  @keyframes hop { 50% { translate: 0 -16px; } }
}
</style>

<div class="page" dir="rtl" lang="ar" id="page">
  <main class="main">
    <span class="tag">نموذج الإجابة</span>
    <h1>قارن بين عمليتي <b>التبخر</b> و<em>التكثف</em> من حيث أوجه التشابه والاختلاف.</h1>
    <div class="result" id="result" hidden></div>

    <section class="table" aria-label="جدول المقارنة">
      <div class="th k">وجه المقارنة</div>
      <div class="th e">☀ التبخر</div>
      <div class="th c">☁ التكثف</div>

      <div class="rl">مكان حدوثه</div>
      <div class="slot" data-slot="place-e" data-kind="diff" tabindex="0" role="button" aria-label="مكان حدوث التبخر"></div>
      <div class="slot" data-slot="place-c" data-kind="diff" tabindex="0" role="button" aria-label="مكان حدوث التكثف"></div>

      <div class="rl">سببه</div>
      <div class="slot" data-slot="cause-e" data-kind="diff" tabindex="0" role="button" aria-label="سبب التبخر"></div>
      <div class="slot" data-slot="cause-c" data-kind="diff" tabindex="0" role="button" aria-label="سبب التكثف"></div>

      <div class="rl">تحوّل حالة الماء</div>
      <div class="slot" data-slot="state-e" data-kind="diff" tabindex="0" role="button" aria-label="تحوّل حالة الماء في التبخر"></div>
      <div class="slot" data-slot="state-c" data-kind="diff" tabindex="0" role="button" aria-label="تحوّل حالة الماء في التكثف"></div>

      <div class="rl">وجه التشابه</div>
      <div class="slot wide" data-slot="same" data-kind="same" tabindex="0" role="button" aria-label="وجه التشابه بين التبخر والتكثف"></div>
    </section>

    <p class="bank-title" id="bankTitle">البطاقات: اسحب كل بطاقة إلى مكانها في الجدول</p>
    <div class="bank" id="bank" data-slot="bank"></div>

    <button class="done-btn" id="done" type="button" disabled>أنهيت ✓</button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </main>

  <aside class="side">
    <div class="say" id="say" aria-live="polite"></div>
    <img class="q" id="q" src="../qattoura.png" alt="قطّورة" width="812" height="1164">
    <div class="drops" id="drops" aria-hidden="true"></div>
    <p class="count" id="count"></p>
  </aside>
</div>

<script>
document.documentElement.dir = 'rtl';
document.documentElement.lang = 'ar';

const CHIPS = [
  { id: 'p1', kind: 'diff', text: 'عند سطح البحر' },
  { id: 'p2', kind: 'diff', text: 'في الأعلى، في السماء' },
  { id: 'c1', kind: 'diff', text: 'حرارة الشمس' },
  { id: 'c2', kind: 'diff', text: 'برودة الجو' },
  { id: 's1', kind: 'diff', text: 'من سائل إلى غاز' },
  { id: 's2', kind: 'diff', text: 'من غاز إلى سائل' },
  { id: 'x1', kind: 'diff', text: 'من سائل إلى صلب' },
  { id: 'x2', kind: 'diff', text: 'في باطن الأرض' },
  { id: 'm1', kind: 'same', text: 'كلتاهما من مراحل دورة الماء' },
  { id: 'm2', kind: 'same', text: 'كلتاهما تحدث بالتسخين' },
  { id: 'm3', kind: 'same', text: 'كلتاهما تحدث عند سطح البحر' }
];
const KEY = { 'place-e': 'p1', 'place-c': 'p2', 'cause-e': 'c1', 'cause-c': 'c2', 'state-e': 's1', 'state-c': 's2', 'same': 'm1' };
const SLOT_IDS = Object.keys(KEY);
const num = n => n.toLocaleString('ar-EG');
const $ = id => document.getElementById(id);

const bank = $('bank'), sayEl = $('say'), hintEl = $('hint'), doneBtn = $('done'), qEl = $('q');
const slots = {};
document.querySelectorAll('.slot').forEach(s => { slots[s.dataset.slot] = s; });
const chips = {};
const where = {};        // chip id -> slot id or 'bank'
let selected = null, drag = null, justDragged = false, locked = false;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function chipIn(slotId) { return CHIPS.find(c => where[c.id] === slotId); }
function filled() { return SLOT_IDS.filter(s => chipIn(s)).length; }

function refresh() {
  const n = filled(), total = SLOT_IDS.length;
  SLOT_IDS.forEach(s => slots[s].classList.toggle('full', !!chipIn(s)));
  $('drops').querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < n));
  $('count').textContent = num(n) + ' من ' + num(total);
  doneBtn.disabled = locked || n < total;
  if (locked) return;
  if (n === 0) sayEl.textContent = 'مرحبًا يا بطل! ساعدني لأقارن بين التبخر والتكثف.';
  else if (n < total) sayEl.textContent = 'أكمل! بقيت ' + num(total - n) + (total - n === 1 ? ' خانة واحدة.' : ' خانات.');
  else sayEl.textContent = 'امتلأ الجدول! راجع إجاباتك، ثم اضغط «أنهيت».';
  hintEl.textContent = n === total ? '' : 'يمكنك لمس البطاقة ثم لمس الخانة، ولمس بطاقة في الجدول يعيدها.';
}

function select(id) {
  selected = id;
  Object.entries(chips).forEach(([k, el]) => el.classList.toggle('selected', k === id));
  Object.values(slots).forEach(s => s.classList.toggle('ready', !!id));
}
function toBank(id) { where[id] = 'bank'; bank.appendChild(chips[id]); }
function refuse(id, msg) {
  const el = chips[id];
  el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
  setTimeout(() => el.classList.remove('no'), 900);
  hintEl.textContent = msg;
}
function drop(id, slotId) {
  if (locked) return;
  select(null);
  if (slotId === 'bank') { toBank(id); refresh(); return; }
  const chip = CHIPS.find(c => c.id === id), slot = slots[slotId];
  if (chip.kind !== slot.dataset.kind) {
    refresh();
    refuse(id, chip.kind === 'same' ? 'البطاقة الخضراء مكانها صف «وجه التشابه».' : 'صف «وجه التشابه» يأخذ بطاقة خضراء.');
    return;
  }
  const old = chipIn(slotId);
  if (old && old.id !== id) toBank(old.id);
  where[id] = slotId;
  slot.appendChild(chips[id]);
  refresh();
}

function targetAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('[data-slot]') : null; }
function clearOver() { document.querySelectorAll('.over').forEach(e => e.classList.remove('over')); }
function onMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const el = chips[drag.id];
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    const g = el.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('selected', 'no');
    g.style.width = el.offsetWidth + 'px';
    document.body.appendChild(g);
    drag.ghost = g; el.classList.add('lifting'); select(null);
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  clearOver();
  const t = targetAt(e.clientX, e.clientY);
  if (t) t.classList.add('over');
}
function endDrag() {
  if (!drag) return;
  if (drag.ghost) drag.ghost.remove();
  chips[drag.id].classList.remove('lifting');
  clearOver(); drag = null;
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const id = drag.id, dragged = !!drag.ghost;
  const t = dragged ? targetAt(e.clientX, e.clientY) : null;
  endDrag();
  if (dragged) {
    justDragged = true; setTimeout(() => { justDragged = false; }, 50);
    if (t) drop(id, t.dataset.slot);
  }
}

function build() {
  shuffle(CHIPS.filter(c => c.kind === 'diff')).concat(shuffle(CHIPS.filter(c => c.kind === 'same'))).forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (c.kind === 'same' ? ' same' : ''); b.textContent = c.text;
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (justDragged || locked) return;
      if (where[c.id] !== 'bank' && !selected) { toBank(c.id); refresh(); return; }
      if (selected && selected !== c.id && where[c.id] !== 'bank') { drop(selected, where[c.id]); return; }
      select(selected === c.id ? null : c.id);
    });
    b.addEventListener('pointerdown', e => {
      if (e.button || locked) return;
      drag = { id: c.id, x: e.clientX, y: e.clientY, pid: e.pointerId, ghost: null };
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
    b.addEventListener('pointercancel', endDrag);
    chips[c.id] = b; where[c.id] = 'bank'; bank.appendChild(b);
  });
  for (let i = 0; i < SLOT_IDS.length; i++) $('drops').appendChild(document.createElement('i'));
}

function finish() {
  if (locked || filled() < SLOT_IDS.length) return;
  locked = true; select(null);
  $('page').classList.add('locked');
  let good = 0;
  SLOT_IDS.forEach(s => {
    const ok = chipIn(s).id === KEY[s];
    if (ok) good++;
    slots[s].classList.add(ok ? 'good' : 'bad');
    if (!ok) {
      const f = document.createElement('p');
      f.className = 'fix';
      f.textContent = 'الصحيح: ' + CHIPS.find(c => c.id === KEY[s]).text;
      slots[s].appendChild(f);
    }
  });
  const total = SLOT_IDS.length;
  const stars = good === total ? 3 : good >= 5 ? 2 : good >= 3 ? 1 : 0;
  const level = good === total ? 'ممتاز' : good >= 5 ? 'جيد' : 'يحتاج إلى مراجعة';
  const r = $('result');
  r.replaceChildren();
  const st = document.createElement('div'); st.className = 'stars';
  st.append('★'.repeat(stars));
  if (stars < 3) { const s = document.createElement('s'); s.textContent = '★'.repeat(3 - stars); st.append(s); }
  const big = document.createElement('p'); big.className = 'big'; big.textContent = num(good) + ' من ' + num(total);
  const lv = document.createElement('p'); lv.textContent = 'المستوى: ' + level;
  const show = document.createElement('p'); show.textContent = 'كل بطاقة في خانتها الصحيحة.';
  r.append(st, big, lv, show);
  r.hidden = false;
  bank.hidden = true; $('bankTitle').hidden = true; doneBtn.hidden = true; hintEl.textContent = '';
  sayEl.textContent = good === total ? 'رائع! قارنتَ بين التبخر والتكثف مقارنة صحيحة.' : good >= 5 ? 'أحسنت! انظر إلى الخانات ذات العلامة ✗ واقرأ الصحيح.' : 'شكرًا لمحاولتك! اقرأ الإجابات الصحيحة في الجدول.';
  qEl.classList.add('happy');
  doneBtn.disabled = true;
  r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

Object.values(slots).concat([bank]).forEach(s => {
  s.addEventListener('click', () => { if (selected) drop(selected, s.dataset.slot); });
  s.addEventListener('keydown', e => {
    if (e.target !== s || !selected) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop(selected, s.dataset.slot); }
  });
});
doneBtn.addEventListener('click', finish);

build();
refresh();
Object.keys(KEY).forEach(k => drop(KEY[k], k)); finish(); sayEl.textContent = 'هذا نموذج الإجابة الصحيحة.';
</script>

</body>
</html>
