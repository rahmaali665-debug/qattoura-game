<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قطّورة تقارن بين التبخر والتكثف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* One smart-board screen. Card table on the right, قطّورة lifting the evaporation and condensation jars,
   both pouring into the water-cycle jar at her feet. The pupils sort eight cards by the objective's
   four criteria: place, direction, cause and change of state. */
:root {
  color-scheme: light;
  --sky-top: #3D9BE6;
  --sky-mid: #8CCBF5;
  --ink: #12305C;
  --white: #FFFFFF;
  --card: #FFE9A6;
  --card-edge: #F2B92F;
  --evap: #F58A1F;
  --cond: #7648C9;
  --cycle: #1F8FE0;
  --ok: #25A35A;
  --wood: #D9A662;
  --wood-dark: #8A5528;
  --bad: #D63B30;
  --font: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(circle at 35% 55%, var(--sky-mid), var(--sky-top) 70%) fixed;
  background-color: var(--sky-top);
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 14px 24px;
}
.page { max-width: 1280px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; }

.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.pill { border-radius: 16px; padding: 4px 18px; font-weight: 800; font-size: clamp(1rem, 1.7vw, 1.5rem); border: 3px solid var(--white); white-space: nowrap; }
.badge { justify-self: start; background: var(--ok); color: var(--white); }
.score { justify-self: end; background: #FFD45C; color: var(--ink); font-variant-numeric: tabular-nums; }
h1 {
  margin: 0; background: var(--white); color: var(--ink); border-radius: 999px; padding: 4px 34px;
  font-weight: 800; font-size: clamp(1.4rem, 3.2vw, 2.6rem); text-align: center; text-wrap: balance;
  box-shadow: 0 5px 0 rgba(18, 48, 92, 0.18);
}
.say { margin: 0; text-align: center; color: var(--white); font-weight: 700; font-size: clamp(1.05rem, 1.9vw, 1.6rem); min-height: 1.5em; text-shadow: 0 2px 0 rgba(18, 48, 92, 0.35); }
.say.wrong { color: #FFF1B8; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 24px; align-items: center; }

/* ---- table ---- */
.table-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.table-title { margin: 0; text-align: center; color: var(--white); font-weight: 800; font-size: clamp(1.1rem, 1.9vw, 1.6rem); }
.table { position: relative; padding-bottom: 90px; }
.table-top {
  background: linear-gradient(#E8BC7C, var(--wood)); border: 4px solid #F0CC94; border-bottom: 18px solid #A9692F;
  border-radius: 20px; padding: 22px 16px; min-height: 250px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; align-content: center;
}
.table::before, .table::after { content: ""; position: absolute; bottom: 0; width: 34px; height: 96px; background: var(--wood-dark); border-radius: 0 0 8px 8px; z-index: -1; }
.table::before { inset-inline-start: 12%; }
.table::after { inset-inline-end: 12%; }
.done { grid-column: 1 / -1; justify-self: center; background: var(--white); border-radius: 999px; padding: 6px 30px; font-weight: 800; font-size: clamp(1.3rem, 2.4vw, 2rem); }
.done .stars { color: #F2B92F; }
.again { align-self: center; font: inherit; font-weight: 700; color: var(--ink); background: var(--white); border: 0; border-radius: 999px; padding: 4px 22px; cursor: pointer; box-shadow: 0 4px 0 rgba(18, 48, 92, 0.2); }
.again:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* ---- cards ---- */
.card {
  font: inherit; font-weight: 700; font-size: clamp(0.92rem, 1.35vw, 1.22rem); line-height: 1.3; color: var(--ink);
  background: linear-gradient(#FFF6D6, var(--card)); border: 3px solid var(--white); border-bottom: 6px solid var(--card-edge);
  border-radius: 14px; padding: 6px 8px; text-align: center; cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none; width: 100%; min-width: 0; position: relative;
}
.card small { display: block; font-size: 0.78em; font-weight: 800; color: #9A5B00; }
.table-top .card:nth-child(odd) { transform: rotate(-2deg); }
.table-top .card:nth-child(even) { transform: rotate(1.5deg); }
.card:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
.card.selected { outline: 4px solid var(--white); box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.45); }
.card.lifting { opacity: 0.3; }
.card.ghost { position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -50%) rotate(-4deg); box-shadow: 0 14px 26px rgba(18, 48, 92, 0.4); }
.card.placed { cursor: default; transform: none; padding: 3px 6px; font-size: clamp(0.8rem, 1.1vw, 1.02rem); }
.card.placed::before {
  content: "✓"; position: absolute; inset-inline-start: -10px; top: -10px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--ok); color: var(--white); border: 3px solid var(--white); font-size: 0.9rem; line-height: 20px; text-align: center;
}
.card.no { border-color: var(--bad); }

/* ---- stage ---- */
.stage {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(110px, 0.75fr) minmax(0, 1fr);
  grid-template-areas: "evap q cond" ". cycle ."; gap: 6px 10px; align-items: start; min-width: 0;
}
.q { grid-area: q; align-self: end; justify-self: center; width: 100%; max-width: 230px; height: auto; margin-top: 40px; }
.jar { position: relative; padding-top: 26px; min-width: 0; }
.jar[data-zone="evap"], .jar[data-zone="cond"] { cursor: pointer; }
.jar[data-zone="evap"] { grid-area: evap; }
.jar[data-zone="cond"] { grid-area: cond; }
.jar[data-zone="cycle"] { grid-area: cycle; margin-top: -20px; }
.jar-label {
  position: absolute; top: 0; inset-inline: 0; margin-inline: auto; width: max-content; max-width: 100%; z-index: 2;
  color: var(--white); border: 3px solid var(--white); border-radius: 16px; padding: 0 18px; text-align: center; line-height: 1.15;
}
.jar-label b { display: block; font-weight: 800; font-size: clamp(1.2rem, 2.3vw, 2rem); }
.jar-label span { font-weight: 500; font-size: clamp(0.8rem, 1.2vw, 1.05rem); }
.jar[data-zone="evap"] .jar-label { background: var(--evap); }
.jar[data-zone="cond"] .jar-label { background: var(--cond); }
.jar[data-zone="cycle"] .jar-label { background: var(--cycle); }
.glass {
  border: 4px solid rgba(255, 255, 255, 0.85); border-radius: 50% / 22px; padding: 40px 10px 22px;
  display: flex; flex-direction: column; gap: 7px; min-height: 270px;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3), 0 8px 0 rgba(255, 255, 255, 0.55);
}
.jar[data-zone="evap"] .glass { background: linear-gradient(#CFE6F7 0%, #EAF3F8 45%, #7FB4C9 55%, #D9C7A0 100%); }
.jar[data-zone="cond"] .glass { background: radial-gradient(ellipse at 60% 45%, #FFFFFF 0 22%, transparent 40%), linear-gradient(#7C9BD0, #C6D6EE); }
.jar[data-zone="cycle"] .glass { min-height: 120px; background: linear-gradient(#DDF6FF 0 30%, #6FD3F7 30% 100%); align-items: center; justify-content: center; }
.cycle-note { font-weight: 800; color: var(--white); text-align: center; font-size: clamp(0.9rem, 1.3vw, 1.15rem); text-shadow: 0 2px 0 rgba(18, 48, 92, 0.35); }
.jar.over .glass, .jar.ready:hover .glass { border-color: #FFE27A; box-shadow: 0 0 0 6px rgba(255, 226, 122, 0.6), 0 8px 0 rgba(255, 255, 255, 0.55); }
.jar:focus-visible { outline: 4px solid var(--white); outline-offset: 4px; border-radius: 20px; }
.slot { border: 3px dashed var(--white); border-radius: 12px; min-height: 44px; background: rgba(255, 255, 255, 0.28); display: flex; }
.slot.full { border-color: transparent; background: none; }

@media (max-width: 820px) {
  .top { grid-template-columns: 1fr; justify-items: center; }
  .badge, .score { justify-self: center; }
  .board { grid-template-columns: 1fr; }
  .stage { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "q q" "evap cond" "cycle cycle"; gap: 14px 10px; }
  .q { max-width: 110px; margin-top: 0; }
  .jar[data-zone="cycle"] { margin-top: 0; }
  .table { padding-bottom: 0; }
  .table::before, .table::after { display: none; }
  .table-top { min-height: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .card.no { animation: shake 0.45s; }
  .q.happy { animation: hop 0.6s 2; }
  @keyframes shake { 20%, 60% { translate: -8px 0; } 40%, 80% { translate: 8px 0; } }
  @keyframes hop { 50% { translate: 0 -18px; } }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <span class="pill badge" id="badge" hidden>نموذج الإجابة</span>
    <span id="badge-space"></span>
    <h1>قطّورة تقارن بين التبخر والتكثف</h1>
    <span class="pill score" id="score" aria-live="polite"></span>
  </header>
  <p class="say" id="say" aria-live="polite"></p>

  <div class="board">
    <section class="table-wrap" aria-label="طاولة البطاقات">
      <p class="table-title">طاولة البطاقات</p>
      <div class="table"><div class="table-top" id="table" data-zone="table"></div></div>
      <button class="again" id="again" type="button">من جديد</button>
    </section>

    <section class="stage" aria-label="الأواني">
      <div class="jar" data-zone="evap" tabindex="0" role="group" aria-label="إناء التبخر">
        <div class="jar-label"><b>التبخر</b><span>المكان، الاتجاه، السبب، التحول</span></div>
        <div class="glass"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      </div>
      <img class="q" id="q" src="qattoura.png" alt="قطّورة ترفع الإناءين" width="812" height="1164">
      <div class="jar" data-zone="cond" tabindex="0" role="group" aria-label="إناء التكثف">
        <div class="jar-label"><b>التكثف</b><span>المكان، الاتجاه، السبب، التحول</span></div>
        <div class="glass"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      </div>
      <div class="jar" data-zone="cycle" role="img" aria-label="إناء دورة الماء">
        <div class="jar-label"><b>دورة الماء</b><span>يصبّ فيه الإناءان</span></div>
        <div class="glass"><p class="cycle-note">التبخر والتكثف<br>مرحلتان في دورة الماء</p></div>
      </div>
    </section>
  </div>
</div>

<script>
const ANSWER_MODE = /answers\/?$/.test(location.pathname) || /[?&]answers\b/.test(location.search);

/* Eight cards: the objective's four criteria for each process. */
const CARDS = [
  { id: 'e1', key: 'المكان', text: 'عند سطح البحر', zone: 'evap' },
  { id: 'e2', key: 'الاتجاه', text: 'يصعد بخار الماء إلى أعلى', zone: 'evap' },
  { id: 'e3', key: 'السبب', text: 'التسخين بحرارة الشمس', zone: 'evap' },
  { id: 'e4', key: 'التحول', text: 'من سائل إلى غاز', zone: 'evap' },
  { id: 'c1', key: 'المكان', text: 'في الأعلى، في السماء', zone: 'cond' },
  { id: 'c2', key: 'الاتجاه', text: 'تتجمع القطرات في الأعلى فتتشكل الغيوم', zone: 'cond' },
  { id: 'c3', key: 'السبب', text: 'التبريد ببرودة الجو', zone: 'cond' },
  { id: 'c4', key: 'التحول', text: 'من غاز إلى سائل', zone: 'cond' }
];
const WHY = {
  e1: 'التبخر يحدث عند سطح البحر.',
  e2: 'بعد التبخر يصعد بخار الماء إلى أعلى.',
  e3: 'حرارة الشمس تسخّن ماء البحر فيتبخر.',
  e4: 'في التبخر يتحول الماء السائل إلى بخار ماء.',
  c1: 'التكثف يحدث في الأعلى، في السماء.',
  c2: 'في التكثف تتجمع القطرات في الأعلى فتتشكل الغيوم.',
  c3: 'بخار الماء يبرد في الأعلى فيتكثف.',
  c4: 'في التكثف يتحول بخار الماء إلى قطرات ماء.'
};
const JAR_NAME = { evap: 'إناء التبخر', cond: 'إناء التكثف' };
const HELP = 'اسحب كل بطاقة من الطاولة إلى إناء التبخر أو إناء التكثف';
const num = n => n.toLocaleString('ar-EG');

const tableEl = document.getElementById('table');
const sayEl = document.getElementById('say');
const scoreEl = document.getElementById('score');
const qEl = document.getElementById('q');
const againBtn = document.getElementById('again');
const jars = {};
document.querySelectorAll('.jar[data-zone="evap"], .jar[data-zone="cond"]').forEach(j => { jars[j.dataset.zone] = j; });
const cycleJar = document.querySelector('.jar[data-zone="cycle"]');

let placed = {};
let order = [];
let selected = null;
let drag = null;
let justDragged = false;
const cards = {};

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function say(text, wrong) {
  sayEl.textContent = text;
  sayEl.classList.toggle('wrong', !!wrong);
}
function count() { return CARDS.filter(c => placed[c.id]).length; }
function showScore() { scoreEl.textContent = '★ ' + num(count()) + ' من ' + num(CARDS.length); }

function buildCards() {
  CARDS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    const k = document.createElement('small'); k.textContent = c.key;
    b.append(k, document.createTextNode(c.text));
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (justDragged || placed[c.id] || ANSWER_MODE) return;
      select(selected === c.id ? null : c.id);
    });
    b.addEventListener('pointerdown', e => {
      if (e.button || placed[c.id] || ANSWER_MODE) return;
      drag = { id: c.id, x: e.clientX, y: e.clientY, pid: e.pointerId, ghost: null };
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
    b.addEventListener('pointercancel', endDrag);
    cards[c.id] = b;
  });
}

function jarAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.jar') : null;
}
function clearOver() { Object.values(jars).forEach(j => j.classList.remove('over')); }

function onMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const card = cards[drag.id];
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    const g = card.cloneNode(true);
    g.classList.add('ghost');
    g.classList.remove('selected', 'no');
    g.style.width = card.offsetWidth + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    card.classList.add('lifting');
    select(null);
  }
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  clearOver();
  const j = jarAt(e.clientX, e.clientY);
  if (j && jars[j.dataset.zone]) j.classList.add('over');
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const id = drag.id, dragged = !!drag.ghost;
  const j = dragged ? jarAt(e.clientX, e.clientY) : null;
  endDrag();
  if (dragged) {
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 50);
    if (j) drop(id, j.dataset.zone);
  }
}
function endDrag() {
  if (!drag) return;
  if (drag.ghost) drag.ghost.remove();
  cards[drag.id].classList.remove('lifting');
  clearOver();
  drag = null;
}

function select(id) {
  selected = id;
  Object.entries(cards).forEach(([k, el]) => el.classList.toggle('selected', k === id));
  Object.values(jars).forEach(j => j.classList.toggle('ready', !!id));
}

function putInJar(c) {
  const slot = jars[c.zone].querySelector('.slot:not(.full)');
  slot.classList.add('full');
  slot.appendChild(cards[c.id]);
  cards[c.id].classList.add('placed');
  cards[c.id].classList.remove('no');
  placed[c.id] = true;
}

function shake(id) {
  const el = cards[id];
  el.classList.remove('no');
  void el.offsetWidth;
  el.classList.add('no');
  setTimeout(() => el.classList.remove('no'), 900);
}

function drop(id, zone) {
  const c = CARDS.find(x => x.id === id);
  select(null);
  if (zone === 'cycle') {
    shake(id);
    say('هذا إناء دورة الماء. ضع البطاقة في إناء التبخر أو إناء التكثف.', true);
    return;
  }
  if (zone !== c.zone) {
    shake(id);
    say('فكّر مرة أخرى: ' + WHY[id], true);
    return;
  }
  putInJar(c);
  showScore();
  if (count() === CARDS.length) finish();
  else say('أحسنت! «' + c.key + ': ' + c.text + '» في ' + JAR_NAME[zone]);
}

function finish() {
  say('كل بطاقة في إنائها الصحيح');
  const d = document.createElement('p');
  d.className = 'done';
  d.style.margin = '0';
  d.append('أحسنتم! ');
  const s = document.createElement('span');
  s.className = 'stars';
  s.textContent = '★★★';
  d.append(s);
  tableEl.replaceChildren(d);
  qEl.classList.add('happy');
}

function layout() {
  document.querySelectorAll('.slot').forEach(s => { s.classList.remove('full'); s.replaceChildren(); });
  tableEl.replaceChildren();
  qEl.classList.remove('happy');
  Object.values(cards).forEach(el => el.classList.remove('placed', 'no', 'selected'));
  const done = Object.assign({}, placed);
  placed = {};
  order.forEach(id => { if (!done[id]) tableEl.appendChild(cards[id]); });
  CARDS.forEach(c => { if (done[c.id]) putInJar(c); });
  showScore();
  if (count() === CARDS.length) finish(); else say(HELP);
}

function start() {
  buildCards();
  order = shuffle(CARDS.map(c => c.id));
  placed = {};
  if (ANSWER_MODE) {
    CARDS.forEach(c => { placed[c.id] = true; });
    document.getElementById('badge').hidden = false;
    document.getElementById('badge-space').hidden = true;
    againBtn.hidden = true;
  }
  layout();
}

Object.values(jars).forEach(j => {
  j.addEventListener('click', () => { if (selected) drop(selected, j.dataset.zone); });
  j.addEventListener('keydown', e => {
    if (e.target !== j || !selected) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop(selected, j.dataset.zone); }
  });
});
cycleJar.addEventListener('click', () => { if (selected) drop(selected, 'cycle'); });
againBtn.addEventListener('click', () => {
  placed = {};
  order = shuffle(CARDS.map(c => c.id));
  layout();
});

start();
</script>
</body>
</html>
